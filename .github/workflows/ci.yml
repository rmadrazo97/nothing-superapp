name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Public values inline (not secrets). Supabase URL + Stripe publishable +
# publishable Supabase key + the $1/mo price id are all designed to be seen
# by anyone hitting the app — using secrets for them causes GitHub Actions
# to mask them in logs (which surfaced as `Invalid supabaseUrl` when the
# masking briefly ate a value on subprocess spawn). Inlining is cleaner.
env:
  NEXT_PUBLIC_SUPABASE_URL: https://pqbwzcjiedllzafgczhx.supabase.co
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_EBeMXcfGsWXNti0Uv6dpSQ_mlCgdY1D
  NEXT_PUBLIC_STRIPE_PRICE_ID: price_1U1sFlLa3bZXHjTBsLbkFk2x
  NEXT_PUBLIC_APP_URL: http://localhost:3000

jobs:
  typecheck-build:
    name: typecheck + build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # pnpm version comes from `packageManager` in package.json.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - name: build web
        env:
          # These are actually private — keep as secrets.
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
        run: pnpm --filter @nothing/web build

  e2e:
    name: playwright (SKIP_STRIPE=1)
    runs-on: ubuntu-latest
    needs: typecheck-build
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # pnpm version comes from `packageManager` in package.json.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: install chromium
        run: pnpm --filter @nothing/web exec playwright install --with-deps chromium
      - name: playwright (short specs)
        env:
          SKIP_STRIPE: '1'
          # Test env — real live Supabase + Kimi are hit by these specs.
          # Stripe golden path is skipped (needs `stripe listen` + real
          # webhook secret; only run locally).
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
          SUPABASE_URL: https://pqbwzcjiedllzafgczhx.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_PROJECT_ID: pqbwzcjiedllzafgczhx
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_PRICE_ID: price_1U1sFlLa3bZXHjTBsLbkFk2x
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
          KIMI_BASE_URL: https://api.moonshot.ai/v1
          KIMI_MODEL: kimi-k2.6
        run: pnpm --filter @nothing/web exec playwright test --reporter=list
      - name: upload playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  verify-migrations-applied:
    name: verify migrations applied to prod
    runs-on: ubuntu-latest
    needs: typecheck-build
    timeout-minutes: 5
    # Only runs on main pushes (post-merge deploy verification), not on
    # PRs. PRs frequently include brand-new migration files that haven't
    # been applied yet — running there would guarantee a false failure.
    # `psql` is preinstalled on ubuntu-latest; no `apt install` needed.
    # The script itself no-ops with a [SKIP] if any of the required
    # secrets are missing, so this job can never block a legit ship.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: verify migrations applied
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: node scripts/verify-migrations-applied.mjs

  verify-backfills-run:
    name: verify backfill scripts run against prod
    runs-on: ubuntu-latest
    needs: verify-migrations-applied
    timeout-minutes: 5
    # Chained after verify-migrations so the schema-level check runs
    # first — no point verifying backfill_log rows if the table itself
    # (migration 028) hasn't been applied yet. Same skip-cleanly-on-
    # missing-secrets pattern as verify-migrations. See
    # services/growth/campaigns/nothing-superapp/ship-log/0.5.6.md
    # lesson 1 for the story that motivated this job.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: verify backfills applied
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: node scripts/verify-backfills-run.mjs
