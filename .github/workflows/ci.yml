name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Public values inline (not secrets). Supabase URL + Stripe publishable +
# publishable Supabase key + the $1/mo price id are all designed to be seen
# by anyone hitting the app — using secrets for them causes GitHub Actions
# to mask them in logs (which surfaced as `Invalid supabaseUrl` when the
# masking briefly ate a value on subprocess spawn). Inlining is cleaner.
env:
  NEXT_PUBLIC_SUPABASE_URL: https://pqbwzcjiedllzafgczhx.supabase.co
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_EBeMXcfGsWXNti0Uv6dpSQ_mlCgdY1D
  NEXT_PUBLIC_STRIPE_PRICE_ID: price_1U1sFlLa3bZXHjTBsLbkFk2x
  # PROD build canonical URL. If localhost, magic-link + OAuth callbacks
  # bake into the client bundle pointing at 127.0.0.1 and every sign-in
  # 500s off the live domain — see the v0.5.16 hotfix.
  NEXT_PUBLIC_APP_URL: https://nothing-superapp.vercel.app

jobs:
  typecheck-build:
    name: typecheck + build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # pnpm version comes from `packageManager` in package.json.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - name: build web
        env:
          # These are actually private — keep as secrets.
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
        run: pnpm --filter @nothing/web build

  e2e:
    name: playwright (SKIP_STRIPE=1)
    runs-on: ubuntu-latest
    needs: typecheck-build
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # pnpm version comes from `packageManager` in package.json.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: install chromium
        run: pnpm --filter @nothing/web exec playwright install --with-deps chromium
      - name: playwright (short specs)
        env:
          SKIP_STRIPE: '1'
          # Test env — real live Supabase + Kimi are hit by these specs.
          # Stripe golden path is skipped (needs `stripe listen` + real
          # webhook secret; only run locally).
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
          SUPABASE_URL: https://pqbwzcjiedllzafgczhx.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_PROJECT_ID: pqbwzcjiedllzafgczhx
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_PRICE_ID: price_1U1sFlLa3bZXHjTBsLbkFk2x
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
          KIMI_BASE_URL: https://api.moonshot.ai/v1
          KIMI_MODEL: kimi-k2.6
        run: pnpm --filter @nothing/web exec playwright test --reporter=list
      - name: upload playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  deploy-prod:
    name: deploy to prod (Vercel)
    runs-on: ubuntu-latest
    needs: typecheck-build
    timeout-minutes: 15
    # Only pushes to main deploy. PRs stay preview-less here (Vercel's own
    # PR previews still work via its GitHub App if that's re-connected).
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    env:
      # Non-secret Vercel identifiers (they were in .vercel/project.json).
      # Inline so a missing VERCEL_ORG_ID / VERCEL_PROJECT_ID secret can't
      # silently break the deploy.
      VERCEL_ORG_ID: team_1lVzz4pk3K8bD7picPjnDEwg
      VERCEL_PROJECT_ID: prj_GHklnwhVvjxsZjAlfHZyRL1IkBCg
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: preflight — skip cleanly if VERCEL_TOKEN missing
        id: pre
        shell: bash
        run: |
          if [ -z "${VERCEL_TOKEN:-}" ]; then
            echo "[SKIP] VERCEL_TOKEN secret not set — deploy step is a no-op. Add it in Settings → Secrets → Actions."
            echo "skip=1" >> "$GITHUB_OUTPUT"
          else
            echo "skip=0" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.pre.outputs.skip != '1'
      # pnpm must be on PATH BEFORE `vercel build` — it invokes the repo's
      # install command (`pnpm install`) as a subshell.
      - uses: pnpm/action-setup@v4
        if: steps.pre.outputs.skip != '1'
      - uses: actions/setup-node@v4
        if: steps.pre.outputs.skip != '1'
        with:
          node-version: 22
          cache: pnpm
      - name: install workspace deps
        if: steps.pre.outputs.skip != '1'
        run: pnpm install --frozen-lockfile
      - name: install vercel CLI
        if: steps.pre.outputs.skip != '1'
        run: npm i -g vercel@latest
      - name: pull env
        if: steps.pre.outputs.skip != '1'
        env:
          # Build-time public env — Vercel usually injects these from the
          # dashboard, but we're building locally so pass them explicitly.
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
      - name: build
        if: steps.pre.outputs.skip != '1'
        env:
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
        run: vercel build --prod --token="$VERCEL_TOKEN"
      - name: deploy
        if: steps.pre.outputs.skip != '1'
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed: $url"

  verify-deploy:
    name: verify live SW_VERSION matches APP_VERSION
    runs-on: ubuntu-latest
    needs: deploy-prod
    timeout-minutes: 5
    # Same gate — main + push only. Polls the live sw.js until SW_VERSION
    # matches the APP_VERSION in the code being deployed, or times out.
    # This is the "no more phantom broadcasts" closure — if this job is
    # red, broadcast should NOT fire. See broadcast-on-version-bump.yml
    # for the mirror check.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: parse APP_VERSION
        id: version
        shell: bash
        run: |
          v=$(grep -Eo "APP_VERSION[[:space:]]*=[[:space:]]*'[^']+'" apps/web/src/lib/version.ts | head -n1 | sed -E "s/.*'([^']+)'.*/\1/")
          if [ -z "$v" ]; then
            echo "[ERR] could not parse APP_VERSION"
            exit 1
          fi
          echo "app_version=$v" >> "$GITHUB_OUTPUT"
          echo "Expected SW_VERSION on live: v$v"
      - name: poll live sw.js
        env:
          EXPECTED: v${{ steps.version.outputs.app_version }}
        shell: bash
        run: |
          set -e
          for i in $(seq 1 24); do
            live=$(curl -s --max-time 10 \
              -H "User-Agent: Mozilla/5.0 (Macintosh; Intel Mac OS X) Safari/605.1.15" \
              https://nothing-superapp.vercel.app/sw.js \
              | grep -Eo "SW_VERSION[[:space:]]*=[[:space:]]*'[^']+'" \
              | head -n1 | sed -E "s/.*'([^']+)'.*/\1/" || echo "")
            echo "attempt $i/24 · live='$live' expected='$EXPECTED'"
            if [ "$live" = "$EXPECTED" ]; then
              echo "✅ MATCH — deploy verified."
              exit 0
            fi
            sleep 10
          done
          echo "❌ TIMEOUT — live SW_VERSION still '$live' after 4 min. Deploy likely failed or edge cache didn't flush. Broadcast will be skipped."
          exit 1

  verify-migrations-applied:
    name: verify migrations applied to prod
    runs-on: ubuntu-latest
    needs: typecheck-build
    timeout-minutes: 5
    # Only runs on main pushes (post-merge deploy verification), not on
    # PRs. PRs frequently include brand-new migration files that haven't
    # been applied yet — running there would guarantee a false failure.
    # `psql` is preinstalled on ubuntu-latest; no `apt install` needed.
    # The script itself no-ops with a [SKIP] if any of the required
    # secrets are missing, so this job can never block a legit ship.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: verify migrations applied
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: node scripts/verify-migrations-applied.mjs

  verify-backfills-run:
    name: verify backfill scripts run against prod
    runs-on: ubuntu-latest
    needs: verify-migrations-applied
    timeout-minutes: 5
    # Chained after verify-migrations so the schema-level check runs
    # first — no point verifying backfill_log rows if the table itself
    # (migration 028) hasn't been applied yet. Same skip-cleanly-on-
    # missing-secrets pattern as verify-migrations. See
    # services/growth/campaigns/nothing-superapp/ship-log/0.5.6.md
    # lesson 1 for the story that motivated this job.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: verify backfills applied
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: node scripts/verify-backfills-run.mjs

  verify-rpcs-defined:
    name: verify RPCs defined in prod pg_proc
    runs-on: ubuntu-latest
    needs: verify-migrations-applied
    timeout-minutes: 5
    # Chained after verify-migrations because it uses the same psql +
    # pooler path; if the schema-level check can't even reach prod,
    # this one won't either. Catches the third class of drift found in
    # v0.5.8 lesson 1 — client code calling `supabase.rpc('foo', …)`
    # where `foo` was never defined in any migration and is absent
    # from prod's pg_proc, causing PostgREST to silently return no
    # rows. Same skip-cleanly-on-missing-secrets pattern.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: verify RPCs defined
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: node scripts/verify-rpcs-defined.mjs
