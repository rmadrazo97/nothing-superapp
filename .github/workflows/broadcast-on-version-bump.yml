name: broadcast-on-version-bump

# Fires after every push to `main` and only actually broadcasts when
# `apps/web/src/lib/version.ts` changed AND its `APP_VERSION` constant
# differs from HEAD~1 → HEAD. Vercel deploys on the same push, so we
# add a short wait before hitting the admin endpoint to give the
# production deploy a head start.
on:
  push:
    branches: [main]
    paths:
      - 'apps/web/src/lib/version.ts'

concurrency:
  group: broadcast-on-version-bump
  cancel-in-progress: false

jobs:
  broadcast:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # Need HEAD~1 to diff APP_VERSION.
          fetch-depth: 2

      - name: detect version change
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          prev=$(git show HEAD~1:apps/web/src/lib/version.ts 2>/dev/null \
            | grep -Eo "APP_VERSION\s*=\s*'[^']+'" \
            | head -n1 | sed -E "s/.*'([^']+)'.*/\1/") || true
          curr=$(grep -Eo "APP_VERSION\s*=\s*'[^']+'" apps/web/src/lib/version.ts \
            | head -n1 | sed -E "s/.*'([^']+)'.*/\1/")
          echo "prev=$prev"
          echo "curr=$curr"
          echo "prev=$prev" >> "$GITHUB_OUTPUT"
          echo "curr=$curr" >> "$GITHUB_OUTPUT"
          if [ "$prev" != "$curr" ] && [ -n "$curr" ]; then
            echo "changed=1" >> "$GITHUB_OUTPUT"
          else
            echo "changed=0" >> "$GITHUB_OUTPUT"
          fi

      - name: skip if unchanged
        if: steps.detect.outputs.changed != '1'
        run: |
          echo "APP_VERSION unchanged (${{ steps.detect.outputs.curr }}). Nothing to broadcast."

      - name: setup node
        if: steps.detect.outputs.changed == '1'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Poll live sw.js until SW_VERSION matches the new APP_VERSION, or
      # give up after ~4 min and skip the broadcast entirely. Prevents the
      # "phantom broadcast" failure mode from the v0.5.4-v0.5.9 wave, where
      # 6 push notifications fired for versions that never actually landed
      # because Vercel auto-deploy was silently disconnected. This mirrors
      # the verify-deploy job in ci.yml — belt + suspenders.
      - name: wait for deploy (poll live sw.js)
        if: steps.detect.outputs.changed == '1'
        env:
          EXPECTED: v${{ steps.detect.outputs.curr }}
        shell: bash
        run: |
          set -e
          for i in $(seq 1 24); do
            live=$(curl -s --max-time 10 \
              -H "User-Agent: Mozilla/5.0 (Macintosh; Intel Mac OS X) Safari/605.1.15" \
              https://nothing-superapp.vercel.app/sw.js \
              | grep -Eo "SW_VERSION[[:space:]]*=[[:space:]]*'[^']+'" \
              | head -n1 | sed -E "s/.*'([^']+)'.*/\1/" || echo "")
            echo "attempt $i/24 · live='$live' expected='$EXPECTED'"
            if [ "$live" = "$EXPECTED" ]; then
              echo "✅ Live matches — proceeding with broadcast."
              exit 0
            fi
            sleep 10
          done
          echo "❌ TIMEOUT — live SW_VERSION still '$live' after 4 min. Skipping broadcast so users don't get a push notification for a version that isn't live."
          exit 1

      - name: broadcast release
        if: steps.detect.outputs.changed == '1'
        env:
          BROADCAST_BASE_URL: https://nothing-superapp.vercel.app
          ADMIN_BROADCAST_SECRET: ${{ secrets.ADMIN_BROADCAST_SECRET }}
          YES: '1'
        run: node scripts/broadcast-release.mjs
